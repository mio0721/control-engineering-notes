<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300"><rect width="940" height="300" rx="16" fill="#101b2b"/><g font-family="sans-serif" text-anchor="middle"><text x="470" y="40" fill="#fff" font-size="23">同一位置，不同速度：接下来的运动不同</text><g fill="#1c3048" stroke="#5cdbd3" stroke-width="2"><rect x="40" y="70" width="390" height="150" rx="12"/><rect x="510" y="70" width="390" height="150" rx="12"/></g><g fill="#eef6ff" font-size="21"><text x="235" y="115">状态 A：[0.4 rad；+0.2 rad/s]</text><text x="235" y="175">位置相同，正在正向运动 →</text><text x="705" y="115">状态 B：[0.4 rad；−0.2 rad/s]</text><text x="705" y="175">← 位置相同，正在反向运动</text></g><text x="470" y="265" fill="#ffcc66" font-size="21">给定模型与未来输入，位置 + 速度才能继续预测运动</text></g></svg>