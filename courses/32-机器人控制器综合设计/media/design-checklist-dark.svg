<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" role="img" aria-labelledby="t d">
<title id="t">机器人控制器设计检查顺序</title><desc id="d">从定义指标和安全边界开始，建立对象模型，调整控制器，检查带宽与稳定裕度，最后验证噪声饱和和工况变化。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#74c8e5"/></marker></defs>
<rect width="880" height="180" fill="#111a24"/>
<g fill="#1b2b39" stroke="#526879" stroke-width="1.5">
<rect x="18" y="48" width="145" height="74" rx="9"/><rect x="190" y="48" width="145" height="74" rx="9"/>
<rect x="362" y="48" width="145" height="74" rx="9"/><rect x="534" y="48" width="145" height="74" rx="9"/>
<rect x="706" y="48" width="155" height="74" rx="9"/>
</g>
<g fill="none" stroke="#74c8e5" stroke-width="2.2">
<path d="M163 85H184" marker-end="url(#a)"/><path d="M335 85H356" marker-end="url(#a)"/>
<path d="M507 85H528" marker-end="url(#a)"/><path d="M679 85H700" marker-end="url(#a)"/>
</g>
<g fill="#eff5f8" font-family="Arial,sans-serif" text-anchor="middle">
<text x="90" y="78" font-size="15">1 指标与</text><text x="90" y="100" font-size="15">安全边界</text>
<text x="262" y="78" font-size="15">2 建立</text><text x="262" y="100" font-size="15">对象模型</text>
<text x="434" y="78" font-size="15">3 调整</text><text x="434" y="100" font-size="15">P / D / I</text>
<text x="606" y="78" font-size="15">4 检查带宽</text><text x="606" y="100" font-size="15">与稳定裕度</text>
<text x="783" y="78" font-size="15">5 验证噪声</text><text x="783" y="100" font-size="15">限幅和变化工况</text>
<text x="440" y="155" font-size="14" fill="#afbfcc">每次只改变少数参数，记录工况和结果，才能知道变化来自哪里</text>
</g></svg>
