<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-labelledby="title desc">
<title id="title">在 Bode 图上读取相位裕度和增益裕度</title><desc id="desc">上图在零分贝处标出增益交越频率，并在相位交越频率处显示增益裕度；下图在增益交越频率处显示相位裕度，并标出相位交越频率。</desc>
<defs><marker id="pm" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#c87520"/></marker><marker id="gm" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#27845f"/></marker></defs>
<rect width="800" height="465" fill="#fff"/>
<g fill="none" stroke="#526170" stroke-width="1.4">
<path d="M85 42V210H725M85 258V420H725"/>
<path d="M85 90H725M85 360H725" stroke="#d8dee5" stroke-dasharray="5 5"/>
<path d="M190 42V420M295 42V420M400 42V420M505 42V420M610 42V420" stroke="#e4e8ec" stroke-dasharray="2 6"/>
<path d="M95 55C205 58 280 73 365 86S470 108 525 130S645 165 715 184" stroke="#347fbd" stroke-width="3"/>
<path d="M95 275C205 278 275 292 350 316S445 340 505 360S620 390 715 406" stroke="#347fbd" stroke-width="3"/>
<path d="M455 42V420M560 42V420" stroke="#778491" stroke-dasharray="5 5"/>
<path d="M560 90V130" stroke="#27845f" stroke-width="3" marker-start="url(#gm)" marker-end="url(#gm)"/>
<path d="M455 340V360" stroke="#c87520" stroke-width="3" marker-start="url(#pm)" marker-end="url(#pm)"/>
</g>
<g fill="#243442" font-family="Arial,sans-serif">
<text x="88" y="28" font-size="18" font-weight="bold">幅频图 · 幅值 (dB)</text><text x="88" y="246" font-size="18" font-weight="bold">相频图 · 相位 (deg)</text>
<text x="48" y="94" font-size="14">0 dB</text><text x="42" y="135" font-size="14">−8 dB</text><text x="43" y="343" font-size="14">−140°</text><text x="43" y="365" font-size="14">−180°</text>
<text x="570" y="108" font-size="16" fill="#27845f">GM</text><text x="464" y="350" font-size="16" fill="#c87520">PM</text>
<text x="455" y="229" font-size="15" text-anchor="middle">ωgc</text><text x="560" y="229" font-size="15" text-anchor="middle">ωpc</text>
<text x="400" y="450" font-size="15" text-anchor="middle">频率 ω（对数刻度）</text>
<text x="632" y="83" font-size="13">0 dB 交越：读 PM</text><text x="600" y="153" font-size="13">−180° 交越：读 GM</text>
</g></svg>
