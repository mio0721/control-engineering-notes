<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="title desc">
<title id="title">单位负反馈控制系统信号流向</title><desc id="desc">目标信号与传感器反馈的实际输出相减，误差经过控制器和被控对象后产生输出；输出沿反馈支路返回比较点。</desc>
